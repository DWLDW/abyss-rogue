<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>심연의 낙인 — Abyss Rogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="screen-title" class="screen"></div>
  <div id="screen-hub" class="screen hidden"></div>
  <div id="screen-help" class="screen hidden"></div>
  <div id="screen-levelup" class="screen hidden"></div>
  <div id="screen-pause" class="screen hidden"></div>
  <div id="screen-death" class="screen hidden"></div>

  <div id="hud" class="hidden"></div>

  <div id="tooltip" class="hidden"></div>
  <div id="toasts"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="touch-ui" class="hidden">
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div class="tbtn" id="tb-attack">⚔</div>
    <div class="tbtn" id="tb-dash">💨</div>
    <div class="tbtn" id="tb-potion">🧪</div>
  </div>
</div>

<script src="js/utils.js?v=18"></script>
<script src="js/config.js?v=18"></script>
<script src="js/input.js?v=18"></script>
<script src="js/save.js?v=18"></script>
<script src="js/sprites.js?v=18"></script>
<script src="js/audio.js?v=18"></script>
<script src="js/fx.js?v=18"></script>
<script src="js/dungeon.js?v=18"></script>
<script src="js/items.js?v=18"></script>
<script src="js/skills.js?v=18"></script>
<script src="js/player.js?v=18"></script>
<script src="js/enemies.js?v=18"></script>
<script src="js/objects.js?v=18"></script>
<script src="js/combat.js?v=18"></script>
<script src="js/ui.js?v=18"></script>
<script src="js/main.js?v=18"></script>
</body>
</html>
